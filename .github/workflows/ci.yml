name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        # a day, a range and a week are read in the machine's timezone: run west of UTC as well, so
        # that a fixture or a boundary built in UTC cannot pass here and fail for a user
        tz: [UTC, America/New_York]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
      # npm ci follows the lockfile; a published package does not.
      - run: node scripts/check-packed-install.mjs

  token-command-windows:
    # The token command runs through the system shell, which is cmd.exe on Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run token-command-shell
